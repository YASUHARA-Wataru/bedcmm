[build-system]
requires = [
    "setuptools>=61.0.0",
    "wheel",
    "Cython",
    "numpy",
]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["bedcmm","bedcmm.pattern","bedcmm.communication"]

[tool.setuptools.exclude-package-data]
"*" = ["commnunication_key_info/*","sample_data/*","tests/*"]


[project]
name = "bedcmm"
version = "2.41"
description = "Pattern Extraction and Periodicity analysis,and commnunication multiple method library based on BEDCMM"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Custom"}
authors = [
  {name = "WATARU YASUHARA"}
]

dependencies = [
  "numpy",
]

[project.optional-dependencies]
dev = [
    "pytest",
]

[project.urls]
Homepage = "https://github.com/YASUHARA-Wataru/bedcmm"
Repository = "https://github.com/YASUHARA-Wataru/bedcmm"
Issues = "https://github.com/YASUHARA-Wataru/bedcmm/issues"